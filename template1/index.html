<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075b74">
  <title>Login Wi-Fi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-lockup">
      <div class="wifi-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M3 11.5a19 19 0 0 1 26 0M7.5 16a12.5 12.5 0 0 1 17 0M12 20.5a6 6 0 0 1 8 0"/><circle cx="16" cy="25" r="1.7" fill="currentColor"/></svg>
      </div>
      <div class="brand-copy">
        <p class="network-name">INSANMOY <span>CONNECT</span></p>
      </div>
    </div>
    <h1>Masuk ke Wi-Fi</h1>

    $(if error)
    <div class="login-error" role="alert">$(error)</div>
    $(endif)

    <div class="login-tabs" role="tablist" aria-label="Pilih jenis akun">
      <button type="button" class="login-tab" role="tab" aria-selected="false" aria-controls="login-fields" data-mode="voucher">Voucher</button>
      <button type="button" class="login-tab is-active" role="tab" aria-selected="true" aria-controls="login-fields" data-mode="member">Member</button>
    </div>

    <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onsubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
      <div id="login-fields" role="tabpanel" aria-label="Detail login">
        <label for="username" class="field-label" id="username-label">Username</label>
        <div class="input-box">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v1a2 2 0 0 0 0 4v1a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 13.5v-1a2 2 0 0 0 0-4z"/><path d="M14 7.5v1m0 2v1m0 2v1"/></svg>
          <input id="username" name="username" type="text" placeholder="Masukkan username" autocomplete="username" autocapitalize="none" required>
        </div>
        <label for="password" class="field-label password-label" hidden>Password</label>
        <div class="input-box password-box" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password">
          <button class="show-password" type="button" aria-label="Tampilkan password">Lihat</button>
        </div>
      </div>
      <button class="connect-button" type="submit">Hubungkan</button>
    </form>

    $(if trial == 'yes')
    <a class="trial-link" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">Coba gratis</a>
    $(endif)
    <p class="photo-credit"><a href="https://commons.wikimedia.org/wiki/File:Pulau_kecil_nan_indah_TN_Karimunjawa.jpg" target="_blank" rel="noreferrer">Foto udara: Budi Wasisto / Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noreferrer">CC BY-SA 4.0</a></p>
  </main>

  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" hidden>
    <input type="hidden" name="username"><input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true">
  </form>
  <script src="md5.js"></script>
  <script>
    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      const password = document.body.dataset.loginMode === 'voucher' ? document.login.username.value : document.login.password.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + password + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)
  <script src="script.js"></script>
</body>
</html>
